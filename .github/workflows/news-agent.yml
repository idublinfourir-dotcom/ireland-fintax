# The news agent (scripts/news-agent.ts): drafts posts about important
# official tax and finance updates and leaves them for an admin to review in
# /admin/posts. It never publishes anything.
#
# Runs Tuesday and Friday mornings, or on demand: the "Run now" button in
# /admin/news, or Actions -> News agent -> Run workflow.
#
# This repository is PUBLIC, so this file and its run logs are public too.
# The script logs counts and public source titles only, never draft text.
# Keep it that way, and never add a pull_request trigger here: that would put
# these secrets within reach of code from a fork.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   required  DB_USER, DB_PASSWORD, DB_CLUSTER, MONGODB_DB (or MONGODB_URI),
#             GROQ_API_KEY
#   optional  OPENROUTER_API_KEY (fallback models), ADMIN_EMAILS + SMTP_HOST,
#             SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM (email the admins),
#             AUTH_URL (the site origin used in that email's link)

name: News agent

on:
  schedule:
    # 06:17 UTC (07:17 Irish summer time). Off the hour on purpose: GitHub
    # delays or drops scheduled runs when everyone's cron fires at :00.
    - cron: "17 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a second request waits rather than racing the first.
concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run:
    # "latest" moves to Ubuntu 26 from 19 Oct 2026. Nothing here depends on
    # the OS release: setup-node brings its own Node, and the job only needs
    # outbound HTTPS. Pin a version only if a migration ever breaks it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # v7 of both run on Node 24; v4 targeted Node 20, which GitHub retired.
      - uses: actions/checkout@v7
        with:
          # The job never pushes, so leave no token behind on the runner.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Retried: the news agent's 23 Oct 2026 run died on a one-off network
      # error at this step.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt $attempt of 3), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Run the news agent
        run: node scripts/news-agent.ts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CLUSTER: ${{ secrets.DB_CLUSTER }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
